<!DOCTYPE html>
<html>
  <head>
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <script type="text/javascript">
      google.charts.load('current', {'packages':['sankey']});
      google.charts.setOnLoadCallback(drawChart);

      function drawChart() {
        google.script.run.withSuccessHandler(function(dataRows) {
          var data = new google.visualization.DataTable();
          data.addColumn('string', 'From');
          data.addColumn('string', 'To');
          data.addColumn('number', 'Weight');
          data.addRows(dataRows);

          var options = { width: 850, sankey: { node: { interactivity: true, label: { fontSize: 12 } } } };
          var chart = new google.visualization.Sankey(document.getElementById('sankey_chart'));
          chart.draw(data, options);
        }).getSankeyData();
      }
    </script>
  </head>
  <body>
    <div id="sankey_chart" style="width: 100%; height: 500px;"></div>
  </body>
</html>
